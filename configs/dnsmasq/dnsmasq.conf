# Mac 1 — primary private DNS for team1.test (Computer Networks project)
# Original Homebrew file backed up next to this one as dnsmasq.conf.bak-<timestamp>

# Ignore /etc/resolv.conf; only use the upstream servers listed below.
no-resolv
# Forward every non-team name to public resolvers, so clients still reach the internet.
server=8.8.8.8
server=1.1.1.1
# We are authoritative for team1.test: answer from local data only, never forward.
# Unknown names in the domain get NXDOMAIN.
local=/team1.test/
# A records (forward + reverse PTR) — both names point at the nginx edge on Mac 2.
# Mac 2 = 10.7.8.240 (confirmed by Member 2, 2026-11-25)
host-record=app.team1.test,10.7.8.240
host-record=api.team1.test,10.7.8.240
# TTL (seconds) on our local answers. The default 0 means "never cache", which breaks the Phase 2 TTL demo.
local-ttl=30
# Log every query to a file so we can prove who asked what.
log-queries
log-facility=/tmp/dnsmasq.log
